<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- DEFINIÇÕES E ESTILOS -->
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- 1. BARRA DE NAVEGAÇÃO SUPERIOR (TOPBAR) -->
  <rect x="0" y="0" width="1200" height="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Logótipo Matriz -->
  <rect x="24" y="16" width="32" height="32" rx="6" fill="#3b82f6"/>
  <path d="M32 36 L32 24 L38 31 L44 24 L44 36" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="37" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.5">Matriz</text>
  <rect x="135" y="20" width="48" height="22" rx="4" fill="#eff6ff"/>
  <text x="143" y="35" font-size="11" font-weight="600" fill="#2563eb">PoC MVP</text>

  <!-- Menu de Navegação -->
  <text x="230" y="37" font-size="14" font-weight="600" fill="#2563eb">Dashboard</text>
  <rect x="225" y="58" width="80" height="3" fill="#2563eb" rx="1.5"/>
  <text x="340" y="37" font-size="14" font-weight="500" fill="#64748b">Projetos</text>
  <text x="430" y="37" font-size="14" font-weight="500" fill="#64748b">Quadro Kanban</text>

  <!-- Seletor de Perfil / Mock Switcher (Direita) -->
  <rect x="910" y="14" width="266" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="932" cy="32" r="12" fill="#e2e8f0"/>
  <text x="926" y="36" font-size="12" font-weight="600" fill="#475569">LF</text>
  <text x="952" y="28" font-size="12" font-weight="600" fill="#0f172a">Luís Ferreira</text>
  <text x="952" y="42" font-size="10" font-weight="500" fill="#2563eb">Gestor de Projeto</text>
  <text x="1155" y="35" font-size="12" fill="#64748b">▾</text>

  <!-- 2. CABEÇALHO DO PROJETO & CONTEXTO -->
  <g transform="translate(40, 88)">
    <text x="0" y="24" font-size="13" font-weight="600" fill="#64748b" text-transform="uppercase" letter-spacing="0.5">Visão Analítica do Projeto</text>
    
    <!-- Dropdown Seletor de Projeto Ativo -->
    <rect x="0" y="34" width="340" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="16" y="60" font-size="16" font-weight="700" fill="#0f172a">Migração Cloud v2</text>
    <rect x="180" y="43" width="58" height="22" rx="11" fill="#ecfdf5"/>
    <text x="190" y="58" font-size="11" font-weight="600" fill="#059669">● Ativo</text>
    <text x="312" y="60" font-size="14" fill="#64748b">▾</text>

    <!-- Barra de Progresso Global do Projeto (RF10 / US05) -->
    <g transform="translate(370, 36)">
      <text x="0" y="15" font-size="12" font-weight="600" fill="#475569">Progresso Global:</text>
      <text x="105" y="15" font-size="14" font-weight="700" fill="#2563eb">45% Concluído</text>
      <text x="215" y="15" font-size="12" font-weight="500" fill="#64748b">(9 de 20 tarefas finalizadas)</text>
      
      <!-- Track da barra -->
      <rect x="0" y="24" width="460" height="12" rx="6" fill="#e2e8f0"/>
      <!-- Progresso preenchido -->
      <rect x="0" y="24" width="207" height="12" rx="6" fill="#2563eb"/>
    </g>

    <!-- Botões de Ação Rápida -->
    <g transform="translate(930, 36)">
      <rect x="0" y="0" width="190" height="40" rx="8" fill="#2563eb" filter="url(#shadow)"/>
      <text x="30" y="25" font-size="14" font-weight="600" fill="#ffffff">+ Nova Tarefa</text>
    </g>
  </g>

  <!-- 3. GRELHA DE KPI CARDS (MÉTRICAS RESUMO) -->
  <g transform="translate(40, 184)">
    <!-- Card 1: Total Tarefas -->
    <rect x="0" y="0" width="260" height="96" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="20" y="32" font-size="13" font-weight="600" fill="#64748b">Total de Tarefas</text>
    <text x="20" y="70" font-size="32" font-weight="700" fill="#0f172a">20</text>
    <rect x="200" y="24" width="40" height="40" rx="8" fill="#f1f5f9"/>
    <text x="214" y="48" font-size="16" fill="#64748b">📋</text>

    <!-- Card 2: Tarefas Concluídas -->
    <rect x="286" y="0" width="260" height="96" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="306" y="32" font-size="13" font-weight="600" fill="#64748b">Concluídas (DONE)</text>
    <text x="306" y="70" font-size="32" font-weight="700" fill="#059669">9</text>
    <rect x="486" y="24" width="40" height="40" rx="8" fill="#ecfdf5"/>
    <text x="500" y="48" font-size="16" fill="#059669">✓</text>

    <!-- Card 3: Em Progresso -->
    <rect x="572" y="0" width="260" height="96" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="592" y="32" font-size="13" font-weight="600" fill="#64748b">Em Progresso (IN_PROGRESS)</text>
    <text x="592" y="70" font-size="32" font-weight="700" fill="#2563eb">7</text>
    <rect x="772" y="24" width="40" height="40" rx="8" fill="#eff6ff"/>
    <text x="786" y="48" font-size="16" fill="#2563eb">⚡</text>

    <!-- Card 4: Tarefas em Atraso (RF11 / US04 - Alerta Crítico) -->
    <rect x="858" y="0" width="262" height="96" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="878" y="32" font-size="13" font-weight="700" fill="#dc2626">Tarefas em Atraso</text>
    <text x="878" y="70" font-size="32" font-weight="800" fill="#dc2626">4</text>
    <rect x="1058" y="24" width="42" height="40" rx="8" fill="#fee2e2"/>
    <text x="1073" y="48" font-size="16" fill="#dc2626">⚠</text>
  </g>

  <!-- 4. GRELHA PRINCIPAL: GRÁFICO DE VELOCIDADE (ESQUERDA) + TAREFAS CRÍTICAS (DIREITA) -->
  <g transform="translate(40, 304)">
    
    <!-- PAINEL ESQUERDO: GRÁFICO DE VELOCIDADE SEMANAL (RF12 / US05) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="670" height="460" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
      <text x="24" y="36" font-size="16" font-weight="700" fill="#0f172a">Velocidade Semanal da Equipa</text>
      <text x="24" y="58" font-size="13" font-weight="400" fill="#64748b">Tarefas finalizadas por dia nos últimos 7 dias (UTC)</text>

      <!-- Eixos e Linhas de Grelha -->
      <line x1="60" y1="360" x2="620" y2="360" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="60" y1="280" x2="620" y2="280" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4"/>
      <line x1="60" y1="200" x2="620" y2="200" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4"/>
      <line x1="60" y1="120" x2="620" y2="120" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4"/>

      <!-- Escala Y -->
      <text x="40" y="364" font-size="11" fill="#94a3b8" text-anchor="end">0</text>
      <text x="40" y="284" font-size="11" fill="#94a3b8" text-anchor="end">2</text>
      <text x="40" y="204" font-size="11" fill="#94a3b8" text-anchor="end">4</text>
      <text x="40" y="124" font-size="11" fill="#94a3b8" text-anchor="end">6</text>

      <!-- Barras do Gráfico (7 dias) -->
      <!-- D1 (30 Out): 1 -->
      <rect x="85" y="320" width="48" height="40" rx="4" fill="#93c5fd"/>
      <text x="109" y="312" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">1</text>
      <text x="109" y="382" font-size="11" fill="#64748b" text-anchor="middle">30 Out</text>

      <!-- D2 (31 Out): 3 -->
      <rect x="165" y="240" width="48" height="120" rx="4" fill="#93c5fd"/>
      <text x="189" y="232" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">3</text>
      <text x="189" y="382" font-size="11" fill="#64748b" text-anchor="middle">31 Out</text>

      <!-- D3 (01 Nov): 0 -->
      <text x="269" y="382" font-size="11" fill="#94a3b8" text-anchor="middle">01 Nov</text>

      <!-- D4 (02 Nov): 2 -->
      <rect x="325" y="280" width="48" height="80" rx="4" fill="#93c5fd"/>
      <text x="349" y="272" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">2</text>
      <text x="349" y="382" font-size="11" fill="#64748b" text-anchor="middle">02 Nov</text>

      <!-- D5 (03 Nov): 4 -->
      <rect x="405" y="200" width="48" height="160" rx="4" fill="#60a5fa"/>
      <text x="429" y="192" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">4</text>
      <text x="429" y="382" font-size="11" fill="#64748b" text-anchor="middle">03 Nov</text>

      <!-- D6 (04 Nov): 1 -->
      <rect x="485" y="320" width="48" height="40" rx="4" fill="#93c5fd"/>
      <text x="509" y="312" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">1</text>
      <text x="509" y="382" font-size="11" fill="#64748b" text-anchor="middle">04 Nov</text>

      <!-- D7 (05 Nov - Hoje): 5 -->
      <rect x="565" y="160" width="48" height="200" rx="4" fill="#2563eb"/>
      <text x="589" y="152" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">5</text>
      <text x="589" y="382" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Hoje</text>

      <!-- Rodapé do Card de Velocidade -->
      <rect x="24" y="410" width="622" height="34" rx="6" fill="#f8fafc"/>
      <text x="36" y="432" font-size="12" font-weight="500" fill="#475569">Média Semanal: <tspan font-weight="700" fill="#0f172a">2.3 tarefas/dia</tspan> • Ritmo atual suficiente para entrega no prazo previsto.</text>
    </g>

    <!-- PAINEL DIREITO: TAREFAS CRÍTICAS E EM ATRASO (RF11 / US04) -->
    <g transform="translate(694, 0)">
      <rect x="0" y="0" width="426" height="460" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
      <text x="20" y="36" font-size="16" font-weight="700" fill="#0f172a">Tarefas que Requerem Atenção</text>
      <text x="20" y="58" font-size="13" font-weight="400" fill="#dc2626">4 tarefas ultrapassaram o prazo ou expiram hoje</text>

      <!-- Item 1 em Atraso (Crítico) -->
      <g transform="translate(16, 76)">
        <rect x="0" y="0" width="394" height="80" rx="8" fill="#fff5f5" stroke="#fecaca" stroke-width="1"/>
        <rect x="12" y="12" width="56" height="20" rx="4" fill="#fee2e2"/>
        <text x="18" y="26" font-size="10" font-weight="700" fill="#b91c1c">ALTA</text>
        <rect x="74" y="12" width="102" height="20" rx="4" fill="#dc2626"/>
        <text x="80" y="26" font-size="10" font-weight="700" fill="#ffffff">Atraso: 3 dias</text>
        <text x="12" y="50" font-size="13" font-weight="600" fill="#0f172a">Criar migração Prisma e modelos</text>
        <text x="12" y="68" font-size="11" fill="#64748b">Resp: <tspan font-weight="600" fill="#334155">Carlos Ramos</tspan> • Estado: <tspan font-weight="600" fill="#2563eb">Em Progresso</tspan></text>
      </g>

      <!-- Item 2 em Atraso -->
      <g transform="translate(16, 166)">
        <rect x="0" y="0" width="394" height="80" rx="8" fill="#fff5f5" stroke="#fecaca" stroke-width="1"/>
        <rect x="12" y="12" width="70" height="20" rx="4" fill="#fef3c7"/>
        <text x="18" y="26" font-size="10" font-weight="700" fill="#b45309">MÉDIA</text>
        <rect x="88" y="12" width="102" height="20" rx="4" fill="#dc2626"/>
        <text x="94" y="26" font-size="10" font-weight="700" fill="#ffffff">Atraso: 1 dia</text>
        <text x="12" y="50" font-size="13" font-weight="600" fill="#0f172a">Configurar suite de testes unitários</text>
        <text x="12" y="68" font-size="11" fill="#64748b">Resp: <tspan font-weight="600" fill="#334155">Ana Silva</tspan> • Estado: <tspan font-weight="600" fill="#475569">A Fazer</tspan></text>
      </g>

      <!-- Item 3 - Expira Hoje -->
      <g transform="translate(16, 256)">
        <rect x="0" y="0" width="394" height="80" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
        <rect x="12" y="12" width="56" height="20" rx="4" fill="#fee2e2"/>
        <text x="18" y="26" font-size="10" font-weight="700" fill="#b91c1c">ALTA</text>
        <rect x="74" y="12" width="86" height="20" rx="4" fill="#d97706"/>
        <text x="80" y="26" font-size="10" font-weight="700" fill="#ffffff">Expira Hoje</text>
        <text x="12" y="50" font-size="13" font-weight="600" fill="#0f172a">Implementar rota POST /tasks</text>
        <text x="12" y="68" font-size="11" fill="#64748b">Resp: <tspan font-weight="600" fill="#334155">Carlos Ramos</tspan> • Estado: <tspan font-weight="600" fill="#2563eb">Em Progresso</tspan></text>
      </g>

      <!-- Link Direto para o Quadro Kanban (RF07) -->
      <g transform="translate(16, 360)">
        <rect x="0" y="0" width="394" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="110" y="26" font-size="13" font-weight="600" fill="#2563eb">Ir para o Quadro Kanban →</text>
      </g>
    </g>

  </g>
</svg>
