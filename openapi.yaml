openapi: 3.1.0
info:
  title: Matriz API — Plataforma de Gestão de Projetos e Acompanhamento de Equipas
  description: >
    Especificação formal dos contratos da API REST do projeto Matriz (PoC/MVP).
    Esta API implementa o modelo arquitetural de Monólito Modular, permitindo
    a gestão de projetos, tarefas em quadro Kanban e cálculo de métricas de progresso.
  version: 1.1.0-rc.1
  contact:
    name: Equipa de Engenharia Matriz
    email: dev@matriz.local
  license:
    name: MIT

servers:
  - url: http://localhost:3000/api/v1
    description: Servidor de desenvolvimento local (Next.js / Node.js)
  - url: /api/v1
    description: URL relativo para chamadas da interface web

tags:
  - name: Autenticação & Utilizadores
    description: Sessão corrente e listagem de utilizadores para atribuição e Mock Switcher.
  - name: Projetos
    description: Operações de ciclo de vida e agregação de projetos.
  - name: Tarefas
    description: Operações de gestão, ciclo de vida e transições de estado de tarefas (Kanban).
  - name: Métricas
    description: Indicadores analíticos agregados e dados para o Dashboard.
  - name: Observabilidade & Saúde
    description: Verificação de disponibilidade do serviço, latência do SQLite e telemetria de memória.

security:
  - UserAuth: []

paths:
  /health:
    get:
      summary: Verificação de disponibilidade e saúde (Healthcheck)
      description: >
        Retorna o estado operacional do serviço, executando um ping ativo à base de dados
        relacional SQLite (SELECT 1), medindo a latência em milissegundos e reportando
        tempo de atividade (uptime) e consumo de memória RAM.
      operationId: getHealthStatus
      tags:
        - Observabilidade & Saúde
      security: []
      responses:
        '200':
          description: Serviço operacional e base de dados acessível.
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp, uptimeSeconds, service, version, checks]
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                  uptimeSeconds:
                    type: integer
                    example: 3600
                  service:
                    type: string
                    example: "matriz-app"
                  version:
                    type: string
                    example: "1.1.0-rc.1"
                  checks:
                    type: object
                    properties:
                      database:
                        type: object
                        properties:
                          status:
                            type: string
                            example: "up"
                          dialect:
                            type: string
                            example: "sqlite"
                          latencyMs:
                            type: number
                            example: 2
                      system:
                        type: object
                        properties:
                          memoryHeapUsedMB:
                            type: number
                            example: 45.2
        '503':
          description: Serviço degradado ou base de dados inacessível.

  /auth/login:
    post:
      summary: Iniciar sessão de utilizador (Login)
      description: >
        Autentica o utilizador através de email e palavra-passe. Em caso de sucesso,
        emite um cookie HTTP-only `matriz_session` e retorna o objeto do utilizador e o token JWT/HMAC.
      operationId: login
      tags:
        - Autenticação & Utilizadores
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "luis.ferreira@matriz.local"
                password:
                  type: string
                  format: password
                  example: "password123"
      responses:
        '200':
          description: Autenticação bem-sucedida. Retorna dados do utilizador e token.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "matriz_session=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Lax; Max-Age=86400"
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                    description: Token de sessão para chamadas de API via Authorization Bearer.
        '400':
          description: Dados de pedido inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciais inválidas (email ou palavra-passe incorreta).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Terminar sessão de utilizador (Logout)
      description: Invalida a sessão ativa, limpando o cookie HTTP-only `matriz_session`.
      operationId: logout
      tags:
        - Autenticação & Utilizadores
      responses:
        '200':
          description: Sessão terminada com sucesso.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "matriz_session=; Path=/; HttpOnly; SameSite=Lax; Max-Age=0"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Sessão terminada com sucesso."

  /auth/me:
    get:
      summary: Obter dados do utilizador em sessão corrente
      description: >
        Retorna o perfil do utilizador autenticado com base no cabeçalho `X-User-Id`
        enviado pelo Mock Switcher do frontend.
      operationId: getCurrentUser
      tags:
        - Autenticação & Utilizadores
      responses:
        '200':
          description: Dados do utilizador autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Cabeçalho X-User-Id ausente ou utilizador não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users:
    get:
      summary: Listar todos os utilizadores elegíveis
      description: >
        Retorna a lista de colaboradores registados na organização para preenchimento
        do Mock Switcher de perfis e dos seletores de atribuição de tarefas.
      operationId: listUsers
      tags:
        - Autenticação & Utilizadores
      responses:
        '200':
          description: Lista de utilizadores.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects:
    get:
      summary: Listar projetos da organização (RF02)
      description: >
        Retorna os projetos ativos ou arquivados da organização com suporte a pesquisa por título
        e paginação configurável.
      operationId: listProjects
      tags:
        - Projetos
      parameters:
        - name: search
          in: query
          required: false
          description: Pesquisa textual por título do projeto (case-insensitive)
          schema:
            type: string
            example: "Migração"
        - name: page
          in: query
          required: false
          description: Número da página (inicia em 1)
          schema:
            type: integer
            default: 1
            minimum: 1
            example: 1
        - name: limit
          in: query
          required: false
          description: Número de itens por página (máximo 50)
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
            example: 10
      responses:
        '200':
          description: Lista de projetos com resumo de progresso e metadados de paginação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          description: Não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Criar novo projeto (US01 / RF01)
      description: >
        Permite a um Gestor de Projeto registar um novo projeto com título, descrição opcional
        e datas de início e entrega planeada.
      operationId: createProject
      tags:
        - Projetos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Projeto criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Dados inválidos (título < 3 caracteres ou targetDate < startDate).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acesso recusado (Apenas Gestor de Projeto pode criar projetos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{projectId}:
    get:
      summary: Obter detalhes de um projeto específico
      description: Retorna os metadados do projeto, incluindo datas e estado.
      operationId: getProject
      tags:
        - Projetos
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalhes do projeto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Projeto não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Atualizar metadados ou estado do projeto (RF01)
      description: >
        Permite a um Gestor de Projeto atualizar o título (3-100 carateres), descrição (até 1000 carateres),
        datas planeadas e estado do projeto.
      operationId: updateProject
      tags:
        - Projetos
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Projeto atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Dados inválidos (título < 3 carateres, descrição > 1000 carateres ou targetDate < startDate).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acesso recusado. Apenas o Gestor responsável (ou com perfil PROJECT_MANAGER) pode editar o projeto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Projeto não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Eliminar projeto e registos dependentes (RF01 / RNF03)
      description: >
        Elimina um projeto existente. As tarefas e comentários associados são eliminados em cascata
        para prevenir dados órfãos na base de dados.
      operationId: deleteProject
      tags:
        - Projetos
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Projeto e dados dependentes eliminados com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Projeto e tarefas associadas eliminados com sucesso."
        '401':
          description: Não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acesso recusado. Apenas o Gestor responsável pode eliminar o projeto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Projeto não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{projectId}/tasks:
    post:
      summary: Criar uma nova tarefa no projeto (US02 / RF04)
      description: >
        Permite a um Gestor de Projeto registar uma nova tarefa associada a um projeto específico,
        definindo título, descrição, nível de prioridade (LOW, MEDIUM, HIGH), data limite de conclusão
        e, opcionalmente, atribuir um membro da equipa responsável.
      operationId: createTask
      tags:
        - Tarefas
      parameters:
        - name: projectId
          in: path
          required: true
          description: Identificador único do projeto (UUID v4 ou CUID).
          schema:
            type: string
            example: "c7b3d8e0-1234-4567-89ab-cdef01234567"
      requestBody:
        required: true
        description: Dados da nova tarefa a registar.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            examples:
              tarefaCompleta:
                summary: Tarefa com membro atribuído e prioridade Alta
                value:
                  title: "Implementar endpoint POST /tasks"
                  description: "Desenvolver rota e validação com schema Zod no backend."
                  priority: "HIGH"
                  dueDate: "2026-11-20T23:59:59Z"
                  assigneeId: "u8f4a1b2-5678-4321-9abc-fedcba987654"
              tarefaBacklog:
                summary: Tarefa não atribuída (Backlog)
                value:
                  title: "Desenhar protótipo de alta fidelidade do Kanban"
                  priority: "MEDIUM"
                  dueDate: "2026-11-25T23:59:59Z"
                  assigneeId: null
      responses:
        '201':
          description: Tarefa registada com sucesso na coluna TODO (A Fazer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Erro de validação nos dados fornecidos (ex. título curto ou data inconsistente com o início do projeto).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 400
                error: "Bad Request"
                message: "A data limite da tarefa não pode ser anterior à data de início do projeto pai."
                timestamp: "2026-11-05T16:50:00Z"
        '401':
          description: Utilizador não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acesso recusado. Apenas utilizadores com papel de Gestor de Projeto (PROJECT_MANAGER) podem registar tarefas com data limite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Projeto pai não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Listar todas as tarefas de um projeto (RF07 / US03)
      description: >
        Retorna a lista de tarefas associadas ao projeto, permitindo filtrar por responsável
        (ex. "Apenas as minhas tarefas" - US06) ou por estado no quadro Kanban.
      operationId: getProjectTasks
      tags:
        - Tarefas
      parameters:
        - name: projectId
          in: path
          required: true
          description: Identificador único do projeto.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filtrar por estado específico (TODO, IN_PROGRESS, DONE).
          schema:
            type: string
            enum: [TODO, IN_PROGRESS, DONE]
        - name: priority
          in: query
          required: false
          description: Filtrar por prioridade (LOW, MEDIUM, HIGH).
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH]
        - name: assigneeId
          in: query
          required: false
          description: Filtrar tarefas atribuídas a um utilizador específico.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Número da página (inicia em 1).
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          required: false
          description: Número de itens por página.
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Lista de tarefas retornada com sucesso e metadados de paginação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '401':
          description: Não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Projeto não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{projectId}/metrics:
    get:
      summary: Obter métricas agregadas do Dashboard (RF10, RF11, RF12 / US05)
      description: >
        Retorna os indicadores operacionais em tempo real: percentagem de conclusão, contadores por estado,
        alerta de tarefas atrasadas, série histórica dos últimos 7 dias e tarefas críticas.
      operationId: getProjectMetrics
      tags:
        - Métricas
        - Projetos
      parameters:
        - name: projectId
          in: path
          required: true
          description: Identificador único do projeto.
          schema:
            type: string
      responses:
        '200':
          description: Métricas agregadas do projeto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMetrics'
        '401':
          description: Não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Projeto não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{taskId}:
    get:
      summary: Obter detalhes de uma tarefa específica
      description: Retorna os metadados da tarefa, responsável, projeto e estado de atraso.
      operationId: getTask
      tags:
        - Tarefas
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalhes da tarefa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tarefa não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Atualizar metadados ou estado da tarefa (RF05)
      description: >
        Permite atualizar o título (3 a 150 caracteres), descrição (até 2000 caracteres),
        prioridade (LOW, MEDIUM, HIGH), estado (TODO, IN_PROGRESS, DONE), data limite e responsável.
      operationId: updateTask
      tags:
        - Tarefas
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Tarefa atualizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Dados inválidos (título < 3 ou > 150 caracteres, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Apenas utilizadores autorizados podem alterar dados restritos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tarefa não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Eliminar uma tarefa (RF05 / RNF03)
      description: >
        Elimina a tarefa e os respetivos comentários dependentes em cascata. Apenas Gestores de Projeto
        podem executar esta operação.
      operationId: deleteTask
      tags:
        - Tarefas
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tarefa eliminada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Tarefa eliminada com sucesso."
        '401':
          description: Não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Apenas Gestores de Projeto podem eliminar tarefas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tarefa não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{taskId}/assignees:
    get:
      summary: Listar responsáveis associados à tarefa
      description: Retorna a lista de todos os colaboradores atribuídos à tarefa (relação N:M).
      operationId: getTaskAssignees
      tags:
        - Tarefas
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de responsáveis da tarefa.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskAssignee'
        '401':
          description: Não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tarefa não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Associar responsável à tarefa
      description: >
        Adiciona um utilizador elegível como responsável à tarefa.
        Impede repetição da mesma associação retornando 409 Conflict.
      operationId: assignUserToTask
      tags:
        - Tarefas
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserRequest'
      responses:
        '201':
          description: Responsável associado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAssignee'
        '400':
          description: ID do utilizador inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tarefa ou utilizador não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Utilizador já associado a esta tarefa (impede duplicados).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{taskId}/assignees/{userId}:
    delete:
      summary: Remover atribuição de responsável da tarefa
      description: Remove a associação de um colaborador específico a uma tarefa.
      operationId: unassignUserFromTask
      tags:
        - Tarefas
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Atribuição removida com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Atribuição removida com sucesso."
        '401':
          description: Não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tarefa ou atribuição não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{taskId}/comments:
    get:
      summary: Listar comentários da tarefa
      description: Retorna a lista cronológica ascendente de comentários associados à tarefa, incluindo autor e data.
      operationId: getTaskComments
      tags:
        - Tarefas
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
          description: Identificador único da tarefa.
      responses:
        '200':
          description: Lista de comentários recuperada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '401':
          description: Não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tarefa não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Adicionar comentário à tarefa
      description: Regista um novo comentário na tarefa. O autor é inferido no backend através da sessão autenticada. Rejeita textos em branco ou com mais de 2000 caracteres.
      operationId: addTaskComment
      tags:
        - Tarefas
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
          description: Identificador único da tarefa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comentário criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Conteúdo inválido (vazio, apenas espaços ou superior a 2000 carateres).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tarefa não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{taskId}/status:
    patch:
      summary: Atualizar o estado de uma tarefa no Kanban (US03 / RF08)
      description: >
        Permite a um Membro de Equipa ou Gestor mover uma tarefa entre as colunas do quadro
        Kanban (TODO, IN_PROGRESS, DONE). Suporta controlo de concorrência através do envio
        opcional do timestamp da última versão conhecida (`previousUpdatedAt`), prevenindo conflitos (EC04).
      operationId: updateTaskStatus
      tags:
        - Tarefas
      parameters:
        - name: taskId
          in: path
          required: true
          description: Identificador único da tarefa a atualizar.
          schema:
            type: string
            example: "t1a2b3c4-9876-5432-10fe-dcba09876543"
      requestBody:
        required: true
        description: Novo estado da tarefa no quadro Kanban.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskStatusRequest'
            examples:
              moverParaProgresso:
                summary: Iniciar execução da tarefa
                value:
                  status: "IN_PROGRESS"
                  previousUpdatedAt: "2026-11-05T10:00:00Z"
              concluirTarefa:
                summary: Marcar tarefa como concluída
                value:
                  status: "DONE"
                  previousUpdatedAt: "2026-11-05T14:30:00Z"
      responses:
        '200':
          description: Estado atualizado com sucesso. Retorna a tarefa atualizada com novo timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Valor de estado inválido (deve ser TODO, IN_PROGRESS ou DONE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Utilizador não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tarefa não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflito de concorrência (EC04). A tarefa foi alterada em simultâneo por outro utilizador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 409
                error: "Conflict"
                message: "A tarefa já foi atualizada por outro utilizador. Por favor recarregue o quadro."
                timestamp: "2026-11-05T16:51:00Z"

components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
        - role
        - createdAt
      properties:
        id:
          type: string
          description: Identificador único do utilizador.
          example: "u8f4a1b2-5678-4321-9abc-fedcba987654"
        name:
          type: string
          description: Nome do utilizador.
          example: "Luís Ferreira"
        email:
          type: string
          format: email
          description: Email institucional único.
          example: "luis.ferreira@matriz.local"
        role:
          type: string
          enum: [PROJECT_MANAGER, TEAM_MEMBER]
          description: Papel operacional no sistema.
          example: "PROJECT_MANAGER"
        createdAt:
          type: string
          format: date-time
          description: Data de registo em UTC.
          example: "2026-10-29T18:00:00Z"

    Project:
      type: object
      required:
        - id
        - title
        - startDate
        - targetDate
        - status
        - managerId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Identificador único do projeto.
          example: "c7b3d8e0-1234-4567-89ab-cdef01234567"
        title:
          type: string
          minLength: 3
          maxLength: 100
          description: Título do projeto.
          example: "Migração Cloud v2"
        description:
          type: string
          nullable: true
          maxLength: 500
          description: Descrição sucinta.
          example: "Projeto de transição para arquitetura moderna em cloud."
        startDate:
          type: string
          format: date
          description: Data de início planeada.
          example: "2026-11-01"
        targetDate:
          type: string
          format: date
          description: Prazo previsto de conclusão.
          example: "2026-11-30"
        status:
          type: string
          enum: [ACTIVE, COMPLETED, ON_HOLD]
          description: Estado do projeto.
          example: "ACTIVE"
        managerId:
          type: string
          description: ID do Gestor responsável.
          example: "u8f4a1b2-5678-4321-9abc-fedcba987654"
        progressPercentage:
          type: number
          nullable: true
          description: Percentagem calculada de conclusão.
          example: 45.0
        createdAt:
          type: string
          format: date-time
          description: Timestamp de criação.
          example: "2026-11-01T09:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp da última atualização.
          example: "2026-11-05T14:00:00Z"

    CreateProjectRequest:
      type: object
      required:
        - title
        - startDate
        - targetDate
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
          description: Título obrigatório do projeto.
          example: "Migração Cloud v2"
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: Descrição opcional (até 1000 caracteres).
          example: "Transição de infraestrutura local para servidores cloud."
        startDate:
          type: string
          format: date
          description: Data de início.
          example: "2026-11-01"
        targetDate:
          type: string
          format: date
          description: Data de conclusão prevista (>= startDate).
          example: "2026-11-30"

    UpdateProjectRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
          description: Título atualizado do projeto (3 a 100 caracteres).
          example: "Migração Cloud v2.1"
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: Descrição atualizada do projeto (até 1000 caracteres).
          example: "Transição de infraestrutura local com foco em redundância e alta disponibilidade."
        startDate:
          type: string
          format: date
          description: Data de início.
          example: "2026-11-01"
        targetDate:
          type: string
          format: date
          description: Data de conclusão prevista (>= startDate).
          example: "2026-12-15"
        status:
          type: string
          enum: [ACTIVE, COMPLETED, ON_HOLD]
          description: Estado do projeto.
          example: "ACTIVE"

    ProjectListResponse:
      type: object
      required:
        - projects
        - pagination
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    PaginationMeta:
      type: object
      required:
        - total
        - page
        - limit
        - totalPages
      properties:
        total:
          type: integer
          description: Total de projetos correspondentes ao filtro.
          example: 24
        page:
          type: integer
          description: Página atual.
          example: 1
        limit:
          type: integer
          description: Número de itens por página.
          example: 10
        totalPages:
          type: integer
          description: Número total de páginas.
          example: 3

    Task:
      type: object
      required:
        - id
        - projectId
        - title
        - priority
        - status
        - dueDate
        - isOverdue
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Identificador único da tarefa.
          example: "t1a2b3c4-9876-5432-10fe-dcba09876543"
        projectId:
          type: string
          description: Identificador do projeto ao qual pertence.
          example: "c7b3d8e0-1234-4567-89ab-cdef01234567"
        assigneeId:
          type: string
          nullable: true
          description: Identificador do utilizador responsável (nulo se não atribuída).
          example: "u8f4a1b2-5678-4321-9abc-fedcba987654"
        title:
          type: string
          minLength: 3
          maxLength: 100
          description: Título da atividade.
          example: "Implementar endpoint POST /tasks"
        description:
          type: string
          nullable: true
          maxLength: 2000
          description: Detalhes e notas da tarefa.
          example: "Desenvolver rota e validação com schema Zod no backend."
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          description: Nível de prioridade da tarefa.
          example: "HIGH"
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE]
          description: Coluna corrente no quadro Kanban.
          example: "IN_PROGRESS"
        dueDate:
          type: string
          format: date-time
          description: Data/hora limite de entrega em formato ISO 8601 UTC (expiração às 23:59:59 UTC).
          example: "2026-11-20T23:59:59Z"
        isOverdue:
          type: boolean
          description: Indicador booleano calculado se a tarefa está ativa e com prazo expirado.
          example: false
        createdAt:
          type: string
          format: date-time
          description: Timestamp de criação em UTC.
          example: "2026-11-05T09:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp da última mutação de dados em UTC.
          example: "2026-11-05T14:30:00Z"

    CreateTaskRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
          description: Título objetivo da tarefa (obrigatório, entre 3 e 150 caracteres, não composto apenas por espaços).
          example: "Implementar endpoint POST /tasks"
        description:
          type: string
          maxLength: 2000
          nullable: true
          description: Descrição e contexto adicional (até 2000 caracteres).
          example: "Desenvolver rota e validação com schema Zod no backend."
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE]
          default: "TODO"
          description: Estado inicial da tarefa no Kanban (default: TODO).
          example: "TODO"
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          default: "MEDIUM"
          description: Prioridade da tarefa (default: MEDIUM).
          example: "HIGH"
        dueDate:
          type: string
          format: date-time
          nullable: true
          description: Data limite de entrega em formato UTC.
          example: "2026-11-20T23:59:59Z"
        assigneeId:
          type: string
          nullable: true
          description: ID do membro a quem a tarefa é atribuída (opcional).
          example: "u8f4a1b2-5678-4321-9abc-fedcba987654"

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
          description: Título atualizado da tarefa (3 a 150 caracteres).
          example: "Implementar e testar endpoint POST /tasks"
        description:
          type: string
          maxLength: 2000
          nullable: true
          description: Descrição atualizada da tarefa.
          example: "Adicionada cobertura de testes unitários defensivos com Zod."
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE]
          description: Estado atualizado no quadro Kanban.
          example: "IN_PROGRESS"
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          description: Nível de prioridade atualizado.
          example: "HIGH"
        dueDate:
          type: string
          format: date-time
          nullable: true
          description: Data limite de entrega atualizada.
          example: "2026-11-25T23:59:59Z"
        assigneeId:
          type: string
          nullable: true
          description: Colaborador atribuído à tarefa.
          example: "u8f4a1b2-5678-4321-9abc-fedcba987654"

    TaskListResponse:
      type: object
      required:
        - tasks
        - pagination
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    AssignUserRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          description: ID do utilizador a associar como responsável à tarefa.
          example: "u8f4a1b2-5678-4321-9abc-fedcba987654"

    TaskAssignee:
      type: object
      required:
        - id
        - taskId
        - userId
        - user
        - assignedAt
      properties:
        id:
          type: string
          description: ID único do registo de atribuição.
        taskId:
          type: string
          description: ID da tarefa.
        userId:
          type: string
          description: ID do colaborador.
        user:
          $ref: '#/components/schemas/User'
        assignedAt:
          type: string
          format: date-time
          description: Timestamp em que a atribuição foi realizada.

    CreateCommentRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: Conteúdo textual do comentário (entre 1 e 2000 caracteres, não aceitando apenas espaços).
          example: "Testes unitários concluídos com sucesso no ambiente local."

    Comment:
      type: object
      required:
        - id
        - taskId
        - authorId
        - content
        - createdAt
        - author
      properties:
        id:
          type: string
          description: Identificador único do comentário.
          example: "cm1a2b3c4-9876-5432-10fe-dcba09876543"
        taskId:
          type: string
          description: Identificador da tarefa comentada.
          example: "t1a2b3c4-9876-5432-10fe-dcba09876543"
        authorId:
          type: string
          description: Identificador do autor do comentário (inferido no backend).
          example: "u8f4a1b2-5678-4321-9abc-fedcba987654"
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: Conteúdo do comentário.
          example: "Testes unitários concluídos com sucesso no ambiente local."
        createdAt:
          type: string
          format: date-time
          description: Data e hora do comentário inferidas no servidor.
          example: "2026-11-05T19:25:00Z"
        author:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
            role:
              type: string

    UpdateTaskStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE]
          description: Novo estado da tarefa no quadro Kanban.
          example: "DONE"
        previousUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp da versão conhecida pelo cliente para prevenir sobrescritas concorrentes (EC04).
          example: "2026-11-05T14:30:00Z"

    ProjectMetrics:
      type: object
      required:
        - projectId
        - progressPercentage
        - totalTasks
        - completedTasks
        - inProgressTasks
        - todoTasks
        - overdueTasksCount
        - weeklyVelocity
        - criticalTasks
      properties:
        projectId:
          type: string
          description: Identificador do projeto.
          example: "c7b3d8e0-1234-4567-89ab-cdef01234567"
        progressPercentage:
          type: number
          format: float
          description: Percentagem de conclusão do projeto (0 a 100).
          example: 45.0
        totalTasks:
          type: integer
          description: Número total de tarefas no projeto.
          example: 20
        completedTasks:
          type: integer
          description: Número de tarefas concluídas (DONE).
          example: 9
        inProgressTasks:
          type: integer
          description: Número de tarefas em execução (IN_PROGRESS).
          example: 7
        todoTasks:
          type: integer
          description: Número de tarefas por iniciar (TODO).
          example: 4
        overdueTasksCount:
          type: integer
          description: Número de tarefas ativas com prazo expirado (corte às 23:59:59 UTC).
          example: 4
        weeklyVelocity:
          type: array
          description: Histórico de tarefas concluídas nos últimos 7 dias.
          items:
            $ref: '#/components/schemas/DailyVelocity'
        criticalTasks:
          type: array
          description: Lista de tarefas que requerem atenção imediata (em atraso ou a expirar hoje).
          items:
            $ref: '#/components/schemas/Task'

    DailyVelocity:
      type: object
      required:
        - date
        - completedCount
      properties:
        date:
          type: string
          format: date
          description: Data do registo (YYYY-MM-DD em UTC).
          example: "2026-11-05"
        completedCount:
          type: integer
          description: Quantidade de tarefas finalizadas nesse dia.
          example: 5

    ErrorResponse:
      type: object
      required:
        - statusCode
        - error
        - message
        - timestamp
      properties:
        statusCode:
          type: integer
          description: Código HTTP de resposta.
          example: 400
        error:
          type: string
          description: Nome padronizado do erro HTTP.
          example: "Bad Request"
        message:
          type: string
          description: Mensagem clara e amigável descrevendo o problema.
          example: "O título da tarefa deve ter entre 3 e 100 caracteres."
        details:
          type: array
          items:
            type: string
          description: Lista opcional com detalhes específicos de validação de campos.
          example: ["title: String must contain at least 3 character(s)"]
        timestamp:
          type: string
          format: date-time
          description: Data/hora da ocorrência do erro em UTC.
          example: "2026-11-05T16:50:00Z"

  securitySchemes:
    UserAuth:
      type: apiKey
      in: header
      name: X-User-Id
      description: Identificador do utilizador autenticado enviado pelo frontend/Mock Switcher para validação de RBAC no backend.
