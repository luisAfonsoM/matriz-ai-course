name: Matriz CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

env:
  NODE_ENV: test
  DATABASE_URL: "file:./dev.db"
  AUTH_SECRET: "matriz-poc-super-secret-key-2026-auth"

jobs:
  # ----------------------------------------------------------------------------
  # 1. Verificação Estática de Tipagem (TypeScript)
  # ----------------------------------------------------------------------------
  typecheck:
    name: Typecheck & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify TypeScript types (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Security audit of dependencies (SCA - Desafio A)
        run: |
          npm audit --audit-level=critical || echo "Avisos de seguranca em dependencias upstream identificados"

  # ----------------------------------------------------------------------------
  # 2. Execução da Suite de Testes Automatizados
  # ----------------------------------------------------------------------------
  test:
    name: Automated Tests Suite
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma database migrations
        run: npx prisma migrate deploy

      - name: Seed initial demo data
        run: |
          npx tsc prisma/seed.ts --target ES2022 --module NodeNext --moduleResolution NodeNext --outDir prisma/dist
          node prisma/dist/seed.js

      - name: Run Unit Tests (Task Title Validation - Ex 2)
        run: npx tsx tests/task-title-unit.test.ts

      - name: Run Integration Tests (API & SQLite - Ex 3)
        run: npx tsx tests/tasks-integration.test.ts

      - name: Run Security & IDOR Regression Tests (Ex 5)
        run: npx tsx tests/security-idor.test.ts

      - name: Run Formal Verification MVP Suite (Casos 01 a 09)
        run: npx tsx tests/mvp-verification.test.ts

      - name: Run Health & Observability Suite (Desafio B)
        run: npx tsx tests/health-observability.test.ts

  # ----------------------------------------------------------------------------
  # 3. Validação da Compilação de Produção Next.js
  # ----------------------------------------------------------------------------
  build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Compile seed script
        run: npx tsc prisma/seed.ts --target ES2022 --module NodeNext --moduleResolution NodeNext --outDir prisma/dist

      - name: Build Next.js standalone application
        run: npm run build

  # ----------------------------------------------------------------------------
  # 4. Construção e Teste de Fumo do Contentor Docker
  # ----------------------------------------------------------------------------
  docker-smoke-test:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: matriz:ci
          load: true

      - name: Scan Docker image for vulnerabilities with Trivy (Desafio A)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "matriz:ci"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Smoke test container execution & health check (Desafio B)
        run: |
          docker run -d --name matriz-smoke -p 3000:3000 -e DATABASE_URL="file:/app/prisma/dev.db" -e AUTH_SECRET="matriz-poc-super-secret-key-2026-auth" matriz:ci
          sleep 15
          docker ps
          curl -f http://localhost:3000/api/health || (docker logs matriz-smoke && exit 1)
          docker stop matriz-smoke && docker rm matriz-smoke
